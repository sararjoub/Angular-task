<div class="cart-card">

  <h2>🛒 Shopping Cart</h2>

  @if (quantity > 0) {

    <div class="cart-row">
      <span>Product</span>
      <strong>{{ productName }}</strong>
    </div>

    <div class="cart-row">
      <span>Unit Price</span>
      <strong>${{ price }}</strong>
    </div>

    <div class="cart-row">
      <span>Quantity</span>
      <strong>{{ quantity }}</strong>
    </div>

    <div class="total">
      <span>Total Price</span>
      <h3>${{ totalPrice }}</h3>
    </div>

  } @else {

    <div class="empty-cart">
      <span>🛒</span>
      <p>Your shopping cart is empty.</p>
    </div>

  }

</div>
