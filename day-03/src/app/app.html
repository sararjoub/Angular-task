<header class="header">
  <h1>⚡ ElectroShop</h1>
  <p>Product Management & Shopping Cart</p>
</header>

<main class="container">

  <div class="product-switcher">
    <button (click)="showLaptop()">Laptop</button>

    <button (click)="showHeadphones()">
      Wireless Headphones
    </button>
  </div>

  <div class="shop-layout">

    <app-product-details
      [productName]="productName()"
      [description]="description()"
      [price]="price()"
      [isAvailable]="isAvailable()"
      (addToCartEvent)="handleAddToCart($event)">
    </app-product-details>

    <app-shopping-cart
      [productName]="cartProductName()"
      [price]="cartPrice()"
      [quantity]="cartQuantity()">
    </app-shopping-cart>

  </div>

</main>
